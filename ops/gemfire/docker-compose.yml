name: low-latency-ai

services:
  gf-locator:
    image: gemfire/gemfire:10.2-jdk21
    container_name: gf-locator
    environment:
      ACCEPT_TERMS: "y"
    command:
      - gfsh
      - start
      - locator
      - --name=locator1
      - --jmx-manager-hostname-for-clients=gf-locator
      - --hostname-for-clients=gf-locator
      - --J=-Dgemfire.prometheus.metrics.emission=Default
      - --J=-Dgemfire.prometheus.metrics.port=7777
      - --J=-Duser.timezone=America/New_York
      - --J=-Dgemfire.prometheus.metrics.interval=15s
      - --J=-Djava.rmi.server.hostname=gf-locator
      - --J=-Dgemfire.tcp-port=7999
    ports:
      - "10334:10334"
      - "1099:1099"
      - "7070:7070"
      - "7999:7999"
      - "7777:7777"
    # Optional persistent storage (uncomment to persist GemFire files across container recreation):
    # volumes:
    #   - gf_locator_data:/data
    networks:
      - gemfire
    healthcheck:
      test: ["CMD-SHELL", "gfsh -e \"connect --jmx-manager=gf-locator[1099]\" >/dev/null 2>&1"]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 10s

  gf-pdx-config:
    image: gemfire/gemfire:10.2-jdk21
    container_name: gf-pdx-config
    volumes:
      - ./pdx-config.gfsh:/scripts/pdx-config.gfsh:ro
    entrypoint:
      - /bin/sh
      - -lc
      - |
        until gfsh -e "connect --jmx-manager=gf-locator[1099]" >/dev/null 2>&1; do
          echo "Waiting for locator to start..."
          sleep 2
        done
        gfsh -e "run --file=/scripts/pdx-config.gfsh"
    networks:
      - gemfire
    depends_on:
      gf-locator:
        condition: service_healthy
    restart: "no"

  gf-server1:
    image: gemfire/gemfire:10.2-jdk21
    container_name: gf-server1
    environment:
      ACCEPT_TERMS: "y"
    command:
      - gfsh
      - start
      - server
      - --name=server1
      - --locators=gf-locator[10334]
      - --hostname-for-clients=gf-server1
      - --start-rest-api=true
      - --http-service-port=7080
      - --J=-Dgemfire.prometheus.metrics.emission=Default
      - --J=-Dgemfire.prometheus.metrics.port=7977
      - --J=-Duser.timezone=America/New_York
      - --J=-Dgemfire.prometheus.metrics.interval=15s
    ports:
      - "40404:40404"
      - "7080:7080"
      - "7977:7977"
    # Optional persistent storage (uncomment to persist GemFire files across container recreation):
    # volumes:
    #   - gf_server1_data:/data
    networks:
      - gemfire
    depends_on:
      gf-locator:
        condition: service_healthy
      gf-pdx-config:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "gfsh -e \"connect --jmx-manager=gf-locator[1099]\" -e \"list members\" 2>/dev/null | grep -q \"server1\""]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 15s

  gf-regions-init:
    image: gemfire/gemfire:10.2-jdk21
    container_name: gf-regions-init
    profiles:
      - regions-init
    volumes:
      - ./regions-init.gfsh:/scripts/regions-init.gfsh:ro
    entrypoint:
      - /bin/sh
      - -lc
      - |
        until gfsh -e "connect --jmx-manager=gf-locator[1099]" >/dev/null 2>&1; do
          echo "Waiting for locator to start..."
          sleep 2
        done
        gfsh -e "run --file=/scripts/regions-init.gfsh"
    networks:
      - gemfire
    depends_on:
      gf-locator:
        condition: service_healthy
      gf-pdx-config:
        condition: service_completed_successfully
      gf-server1:
        condition: service_healthy
    restart: "no"

  gf-function-deploy:
    image: gemfire/gemfire:10.2-jdk21
    container_name: gf-function-deploy
    profiles:
      - function-deploy
    depends_on:
      gf-locator:
        condition: service_healthy
      gf-server1:
        condition: service_healthy
      gf-regions-init:
        condition: service_completed_successfully
    volumes:
      - ../../functions/inference-function/target:/jars:ro
    entrypoint:
      - /bin/sh
      - -lc
      - |
        FUNCTION_JAR=""
        for jar in /jars/*.jar; do
          [ -f "$$jar" ] || continue
          case "$${jar##*/}" in
            original-*.jar) continue ;;
          esac
          FUNCTION_JAR="$$jar"
          break
        done
        if [ -z "$$FUNCTION_JAR" ]; then
          if [ -d /jars/inference-function-0.0.1-SNAPSHOT.jar ]; then
            echo "Found directory /jars/inference-function-0.0.1-SNAPSHOT.jar (expected a file)." >&2
            echo "This can happen when Docker created a bind-mount directory before the JAR existed." >&2
            echo "Remove that directory on host, rebuild, and retry." >&2
          fi
          echo "No function JAR found in /jars." >&2
          echo "Please make sure the function is built on the host first (for example: ./mvnw -DskipTests clean package)." >&2
          ls -la /jars >&2 || true
          exit 1
        fi
        until gfsh -e "connect --jmx-manager=gf-locator[1099]" -e "list members" 2>/dev/null | grep -q "server1"; do
          echo "Waiting for server1 to be ready..."
          sleep 2
        done
        gfsh \
          -e "connect --jmx-manager=gf-locator[1099]" \
          -e "deploy --jar=$$FUNCTION_JAR" \
          -e "list functions"
    networks:
      - gemfire
    restart: "no"

networks:
  gemfire:
    name: gemfire
    driver: bridge

# Optional named volumes for persistence (uncomment if enabling service volumes above):
# volumes:
#   gf_locator_data:
#   gf_server1_data:

spring.application.name=low-latency-ai

ai.model.model=file:../../models/distilbert/distilbert-base-uncased-finetuned-sst-2-english/model.onnx
ai.model.tokenizer=file:../../models/distilbert/distilbert-base-uncased-finetuned-sst-2-english/tokenizer.json

product.reviews.path=file:../../ops/data/product-reviews.csv

spring.data.gemfire.pool.locators=localhost[10334]

# Spring Boot Docker Compose integration
# - uses ops/gemfire/docker-compose.yml
# - runs one-shot init/deploy profiles on startup
# - keeps containers on shutdown (stop), with recreate/orphan cleanup at next start
spring.docker.compose.file=../../ops/gemfire/docker-compose.yml
spring.docker.compose.profiles.active=regions-init,function-deploy
spring.docker.compose.lifecycle-management=start-and-stop

# One-shot service stability: prevent stale container/network state between runs.
spring.docker.compose.start.arguments[0]=--force-recreate
spring.docker.compose.start.arguments[1]=--remove-orphans
# Optional: reduce Docker image-pull log noise during startup
spring.docker.compose.start.arguments[2]=--quiet-pull

# Optional debug logging
#logging.level.org.springframework.modulith=DEBUG
